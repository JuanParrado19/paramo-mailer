# Dentro del `server { … }` HTTPS del dominio que expone el servicio.
# Formularios públicos y API bajo /mail/ → mailer-server en 127.0.0.1:8080.
location /mail/ {
    client_max_body_size 10m;          # adjuntos en base64 por /v1/send
    proxy_pass          http://127.0.0.1:8080/;
    proxy_http_version  1.1;
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;   # requiere trustProxy: true
    proxy_read_timeout  60s;
}
